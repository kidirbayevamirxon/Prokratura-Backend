[project]
name = "prokratura-backend"
version = "0.1.0"
description = "Prokratura backend system for mahallas and mahalla yettiligi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.0",
    "alembic-postgresql-enum>=1.8.0",
    "asyncpg>=0.30.0",
    "bcrypt==4.0.1",
    "fastapi>=0.119.1",
    "passlib[argon2]>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.1.1",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
    "pydantic>=2.10.0",
]

[dependency-groups]
dev = [
    "taskipy>=1.14.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
]

[tool.taskipy.tasks]
generate = "alembic revision --autogenerate -m"
migrate = "alembic upgrade head"
dev = "uvicorn backend.main:app --reload --port 8000"
test = "pytest"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
